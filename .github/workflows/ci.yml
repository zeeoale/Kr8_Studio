name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.4.0"
          cache: npm
      - name: Install FFmpeg and FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version
          ffprobe -version
      - run: npm ci
      - run: npm run demo:prepare
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run audit:public
